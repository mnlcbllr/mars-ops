[package]
name = "ares-app"
description = "ARES desktop shell: a thin IPC layer over ares-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "ares_app_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ares-core = { path = "../crates/ares-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
